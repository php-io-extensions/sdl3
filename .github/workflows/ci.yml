name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: PHP ${{ matrix.php }} ${{ matrix.ts }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        php: ['8.4', '8.5']
        ts: [nts, zts]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
        env:
          phpts: ${{ matrix.ts == 'zts' && 'ts' || 'nts' }}

      - name: Install SDL 3 (Linux)
        if: runner.os == 'Linux'
        id: sdl
        uses: libsdl-org/setup-sdl@v1
        with:
          version: 3-latest
          pre-release: false
          build-type: Release
          install-linux-dependencies: true
          add-to-environment: true

      - name: Point pkg-config at SDL 3 (Linux)
        if: runner.os == 'Linux'
        run: echo "PKG_CONFIG_PATH=${{ steps.sdl.outputs.prefix }}/lib/pkgconfig:${{ steps.sdl.outputs.prefix }}/lib64/pkgconfig" >> "$GITHUB_ENV"

      - name: Install SDL 3 (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl3 pkgconf

      - name: Build
        run: |
          phpize
          ./configure --enable-sdl3
          make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

      - name: Load
        run: |
          php -n -d extension="$PWD/modules/sdl3.so" -r 'exit(extension_loaded("sdl3") ? 0 : 1);'
          php -n -d extension="$PWD/modules/sdl3.so" --ri sdl3
